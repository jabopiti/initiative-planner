<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Initiative Planner</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Shell only. No brand content here: the wordmark text, like every
         other label, comes from the data model. That goes for the skip
         link's own label too, which boot() writes. -->

    <!-- First thing in the tab order. A button rather than an anchor: the
         address fragment belongs to the router, so an href="#root" would be
         read as a route and land the reader on Portfolio. -->
    <button type="button" class="skip-link" id="skip-link"></button>

    <!-- The icon sprite, injected once at boot. One set of <symbol>s that
         every <use> in the app points at. -->
    <div id="sprite" hidden></div>

    <header class="shell-header">
      <div class="wordmark" id="wordmark"></div>
      <div class="nav-toggle" id="nav-toggle"></div>
      <nav class="shell-nav" id="nav" aria-label="Main"></nav>
      <div class="shell-actions" id="shell-actions"></div>
    </header>

    <div id="banner" hidden></div>

    <main id="root" tabindex="-1"></main>

    <!-- Hash routing has no page reload to announce itself, so this stands
         in for one: navigate() and the hashchange listener write the new
         page's heading here for assistive tech, and move focus to <main>. -->
    <div id="route-announcer" class="sr-only" role="status" aria-live="polite"></div>

    <!-- Popovers are positioned from their trigger's rectangle, so they live
         at the top level rather than inside the region that opened them. -->
    <div id="popover" role="dialog" aria-modal="false" hidden></div>

    <!-- One transient confirmation at a time, announced politely. -->
    <div id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
